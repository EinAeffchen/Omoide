[project]
name = "omoide"
version = "0.7.5"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "apscheduler==3.11.0",
    "fastapi>0.128.0",
    "ffmpeg-python==0.2.0",
    "hdbscan==0.8.41",
    "imagehash==4.3.2",
    # DirectML build on Windows: GPU acceleration on any DX12 GPU from the
    # same small package. It lags behind upstream (sustained engineering).
    "onnxruntime==1.27.0; sys_platform != 'win32'",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "opencv-python==4.11.0.86",
    "insightface>=0.7.3",
    "python-dateutil>=2.9.0.post0",
    "piexif==1.1.3",
    "pydantic==2.11.3",
    "pyside6>=6.9.1",
    "python-multipart==0.0.32",
    # Use pywebview without the Qt extra to avoid pulling PyQt*
    # We rely on PySide6 as the Qt backend.
    "pywebview>=6.0",
    "qtpy>=2.4.1",
    "scenedetect==0.6.6",
    "sqlite-vec==0.1.9",
    "sqlmodel==0.0.24",
    "tokenizers>=0.22.2",
    "uvicorn==0.34.2",
    "pillow>=12.1.1",
    "pillow-heif>=0.22.0",
    "reverse-geocoder>=1.5.1",
]

[tool.uv]
# insightface requires "onnxruntime", which would install next to
# onnxruntime-directml on Windows and overwrite the same module. Drop it there.
override-dependencies = [
    "onnxruntime==1.27.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.19.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
